name: Verification avant Merge

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  tests-automatiques:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      # --- EXEMPLE POUR NODE.JS / REACT ---
      - name: 2. Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Installer les dépendances et tester
        run: |
          npm install
          npm test
